<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zama - Acceso</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase tracking-wider" href="tienda.html">Zama Shop</a>
            <a href="tienda.html" class="btn btn-outline-light btn-sm rounded-0">Volver a la Tienda</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5">
                <div class="bg-white p-4 border shadow-sm">

                    <div id="seccion-login">
                        <h3 class="fs-5 fw-bold text-uppercase text-dark mb-3 tracking-wide text-center">Iniciar Sesión
                        </h3>
                        <hr>
                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
                                <input type="email" class="form-control rounded-0" id="login-email" required
                                    placeholder="correo@ejemplo.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Contraseña</label>
                                <input type="password" class="form-control rounded-0" id="login-password" required
                                    placeholder="******">
                            </div>

                            <div class="text-end mb-3">
                                <button type="button" id="btn-ir-a-recuperar"
                                    class="btn btn-link text-muted p-0 border-0 bg-transparent text-decoration-none"
                                    style="font-size: 0.75rem;">
                                    ¿Olvidaste tu contraseña?
                                </button>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 rounded-0 text-uppercase fw-bold py-2 mt-2">
                                Entrar a mi cuenta
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted small mb-1">¿Aún no tienes una cuenta en Zama?</p>
                            <button id="btn-ir-a-registro"
                                class="btn btn-link text-dark fw-bold text-uppercase small text-decoration-underline p-0 border-0 bg-transparent"
                                style="font-size: 0.8rem;">
                                Crear Cuenta Nueva
                            </button>
                        </div>
                    </div>

                    <div id="seccion-registro" class="d-none">
                        <h3 class="fs-5 fw-bold text-uppercase text-dark mb-3 tracking-wide text-center">Crear Cuenta
                            Nueva</h3>
                        <hr>
                        <form id="form-registro">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Nombre Completo</label>
                                <input type="text" class="form-control rounded-0" id="reg-nombre" required
                                    placeholder="Ej: Diego Nariño">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
                                <input type="email" class="form-control rounded-0" id="reg-email" required
                                    placeholder="correo@ejemplo.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Contraseña</label>
                                <input type="password" class="form-control rounded-0" id="reg-password" required
                                    placeholder="Mínimo 6 caracteres">
                            </div>
                            <button type="submit" class="btn btn-dark w-100 rounded-0 text-uppercase fw-bold py-2 mt-2">
                                Registrarme
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted small mb-1">¿Ya tienes una cuenta registrada?</p>
                            <button id="btn-ir-a-login"
                                class="btn btn-link text-dark fw-bold text-uppercase small text-decoration-underline p-0 border-0 bg-transparent"
                                style="font-size: 0.8rem;">
                                Iniciar Sesión en su lugar
                            </button>
                        </div>
                    </div>

                    <div id="seccion-recuperar" class="d-none">
                        <h3 class="fs-5 fw-bold text-uppercase text-dark mb-3 tracking-wide text-center">Recuperar
                            Contraseña</h3>
                        <p class="text-muted text-center small mb-3">Ingresa tu correo electrónico para restablecerla.
                        </p>
                        <hr>
                        <form id="form-recuperar">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Tu Correo Registrado</label>
                                <input type="email" class="form-control rounded-0" id="recuperar-email" required
                                    placeholder="correo@ejemplo.com">
                            </div>
                            <button type="submit" class="btn btn-dark w-100 rounded-0 text-uppercase fw-bold py-2 mt-2">
                                Enviar Código
                            </button>
                        </form>
                        <div class="text-center mt-4">
                            <button id="btn-recuperar-a-login"
                                class="btn btn-link text-dark fw-bold text-uppercase small text-decoration-underline p-0 border-0 bg-transparent"
                                style="font-size: 0.8rem;">
                                Volver al Inicio de Sesión
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
