<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zama - Mi Carrito</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase tracking-wider m-0 fs-4" href="index.html"
                style="font-family: sans-serif;">Zama</a>
            <div class="ms-auto d-flex align-items-center gap-4">
                <a class="nav-link fw-semibold text-uppercase small tracking-wider text-dark"
                    href="tienda.html">Tienda</a>
                <a class="nav-link fw-semibold text-uppercase small tracking-wider text-dark"
                    href="index.html">Inicio</a>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <h2 class="display-5 fw-light mb-4" style="font-family: sans-serif;">Mi Carrito de Compras</h2>

        <div class="row g-4">
            <div class="col-10 col-md-8">
                <div id="lista-carrito" class="d-flex flex-column gap-3">
                </div>
            </div>

            <div class="col-10 col-md-4">
                <div class="bg-white p-4 border rounded-0 shadow-sm">
                    <h3 class="fs-5 fw-semibold mb-3 text-uppercase">Resumen</h3>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold fs-5">Total:</span>
                        <span id="total-precio" class="fw-bold fs-4 text-dark">$0</span>
                    </div>
                    <button id="btn-vaciar"
                        class="btn btn-outline-danger w-100 rounded-0 mb-2 text-uppercase fw-semibold btn-sm">Vaciar
                        Carrito</button>
                    <button class="btn btn-dark w-100 rounded-0 text-uppercase fw-semibold">Proceder al Pago</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function cargarCarrito() {
            // Leemos los productos guardados en la memoria del navegador
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const listaContenedor = document.getElementById('lista-carrito');
            const totalContenedor = document.getElementById('total-precio');

            listaContenedor.innerHTML = '';
            let sumaTotal = 0;

            if (carrito.length === 0) {
                listaContenedor.innerHTML = `<p class="text-muted">Tu carrito está vacío actualmente.</p>`;
                totalContenedor.innerText = `$0`;
                return;
            }

            // Recorremos los productos para dibujarlos en la pantalla y sumar precios
            carrito.forEach((producto, index) => {
                sumaTotal += producto.precio;

                listaContenedor.innerHTML += `
                    <div class="d-flex align-items-center justify-content-between bg-white p-3 border shadow-sm">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${producto.imagen}" style="width: 70px; height: 90px; object-fit: cover;">
                            <div>
                                <h4 class="fs-6 fw-bold m-0 text-uppercase">${producto.nombre}</h4>
                                <p class="text-muted small m-0">$${producto.precio.toLocaleString('es-CO')}</p>
                            </div>
                        </div>
                        <button onclick="eliminarProducto(${index})" class="btn btn-sm btn-link text-danger text-decoration-none">Quitar</button>
                    </div>
                `;
            });

            // Mostramos la suma total formateada en pesos colombianos
            totalContenedor.innerText = `$${sumaTotal.toLocaleString('es-CO')}`;
        }

        function eliminarProducto(index) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            carrito.splice(index, 1); // Quitamos el producto seleccionado
            localStorage.setItem('carrito', JSON.stringify(carrito));
            cargarCarrito(); // Volvemos a renderizar la lista
        }

        document.getElementById('btn-vaciar').addEventListener('click', () => {
            localStorage.removeItem('carrito');
            cargarCarrito();
        });

        // Ejecutar al cargar la página
        cargarCarrito();
    </script>
</body>

</html>
